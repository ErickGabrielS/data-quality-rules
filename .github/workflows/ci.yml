name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test --configuration Release

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t data-quality-rules .
      - name: Smoke test
        run: |
          docker run -d --name dq -p 8080:8080 data-quality-rules
          for i in $(seq 1 30); do curl -sf localhost:8080/openapi/v1.json >/dev/null && break; sleep 1; done
          curl -sf -X POST localhost:8080/api/validation/run | tee /dev/stderr | jq -e '.violations > 0'
          curl -sf -X POST localhost:8080/api/ai/rules -H 'Content-Type: application/json' \
            -d '{"request":"ISBN obrigatório quando a categoria for Livro"}' | tee /dev/stderr | jq -e '.ok == true and .preview.wouldFail == 2'
